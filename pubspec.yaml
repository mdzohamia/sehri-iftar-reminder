name: sehri_iftar_reminder
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.0
  adhan: ^2.0.0+1
  audioplayers: ^6.0.0
  flutter_foreground_task: any
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/audio/
